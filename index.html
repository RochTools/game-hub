<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Games Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <title>Games Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <h1>Games Hub</h1>
    </div>
    <button id="installBtn" hidden>Install</button>
    <button id="menuBtn" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main id="home">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="search" type="search" placeholder="Search games" autocomplete="off">
    </label>



    <div id="grid" class="grid"></div>
    <div id="noResults" class="empty" hidden></div>
  </main>

  <nav id="cats" class="cats" aria-label="Categories">
    <button class="chip" data-players="1" aria-pressed="false">
      <svg viewBox="0 0 32 24" aria-hidden="true"><circle cx="16" cy="8" r="5"/><path d="M6 23c0-5 4.5-8 10-8s10 3 10 8z"/></svg>
      <span>1 Player</span>
    </button>
    <button class="chip" data-players="2" aria-pressed="false">
      <svg viewBox="0 0 32 24" aria-hidden="true"><circle cx="10" cy="8" r="4.2"/><path d="M2 22c0-4.2 3.6-7 8-7s8 2.8 8 7z"/><circle cx="22" cy="8" r="4.2"/><path d="M14 22c0-4.2 3.6-7 8-7s8 2.8 8 7z"/></svg>
      <span>2 Player</span>
    </button>
    <button class="chip" data-players="4" aria-pressed="false">
      <svg viewBox="0 0 32 24" aria-hidden="true"><circle cx="4" cy="8" r="3"/><path d="M0 22c0-3.6 1.8-6.2 4-6.2s4 2.6 4 6.2z"/><circle cx="12" cy="8" r="3"/><path d="M8 22c0-3.6 1.8-6.2 4-6.2s4 2.6 4 6.2z"/><circle cx="20" cy="8" r="3"/><path d="M16 22c0-3.6 1.8-6.2 4-6.2s4 2.6 4 6.2z"/><circle cx="28" cy="8" r="3"/><path d="M24 22c0-3.6 1.8-6.2 4-6.2s4 2.6 4 6.2z"/></svg>
      <span>4 Player</span>
    </button>
  </nav>

  <div id="backdrop"></div>
  <aside id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Menu</h2>
      <button id="drawerClose" aria-label="Close menu">✕</button>
    </div>

    <section class="saved">
      <h3>Saved Games <span class="saved-heart">❤</span></h3>
      <div id="savedList"></div>
    </section>
  </aside>

  <section id="player" hidden>
    <iframe id="frame" title="game"
      allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope; clipboard-write"
      allowfullscreen></iframe>

    <button id="closeBtn" aria-label="Hold 2 seconds to close">
      <svg viewBox="0 0 56 56" width="56" height="56">
        <circle class="track" cx="28" cy="28" r="24" />
        <circle id="ring" class="ring" cx="28" cy="28" r="24" pathLength="100"
                transform="rotate(-90 28 28)" />
        <path class="x" d="M20 20 L36 36 M36 20 L20 36" />
      </svg>
    </button>
  </section>

  <script src="app.js"></script>
</body>
</html>
