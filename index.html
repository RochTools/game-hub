<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#090d1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Games Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    (function () {
      try {
        var m = localStorage.getItem('hubTheme');
        var light = m === 'light' || (m !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <title>Games Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="offlineBar" role="status" hidden>You're offline · games need internet</div>
  <div id="toast" role="status" hidden></div>
  <header id="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark" data-ic="spark"></div>
        <div><h1>Games Hub</h1><small>YOUR NEXT PLAYGROUND</small></div>
      </div>
      <button id="installBtn" hidden>Install</button>
      <button id="searchToggle" aria-label="Open search" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </button>
      <button id="menuBtn" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
    <label class="search" id="searchPanel" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="search" type="search" placeholder="Search games" autocomplete="off">
      <button id="searchClose" type="button" aria-label="Close search">✕</button>
    </label>
  </header>

  <main id="home">
    <section id="dailySection" class="section" hidden></section>

    <section id="recentSection" class="section recent-section" hidden>
      <div class="section-heading"><div><span class="eyebrow">PICK UP WHERE YOU LEFT OFF</span><h2 data-ic="clock">Recently Played</h2></div><button id="recentClear" class="text-btn" type="button">Clear</button></div>
      <div id="recentCard" class="recent-row"></div>
    </section>

    <section class="section featured-section">
      <div class="section-heading"><div><span class="eyebrow">HANDPICKED FOR YOU</span><h2 data-ic="fire">Top Games</h2></div><div class="slider-dots" id="sliderDots" aria-label="Featured game pages"></div></div>
      <div class="featured-window"><div id="featuredTrack" class="featured-track"></div></div>
    </section>

    <div class="library-heading"><div><span class="eyebrow">EXPLORE & PLAY</span><h2 data-ic="gamepad">Game Library</h2></div><div class="lib-right"><span id="gameCount" class="game-count"></span>
      <label class="sort"><span data-ic="sort"></span>
        <select id="sortSel" aria-label="Sort games">
          <option value="default">Default</option>
          <option value="az">A – Z</option>
          <option value="new">Newest</option>
          <option value="most">Most played</option>
        </select></label></div></div>

    <div id="genres" class="genres" role="toolbar" aria-label="Genres"></div>

    <div id="grid" class="grid"></div>
    <div id="noResults" class="empty" hidden></div>
  </main>

  <nav id="cats" class="cats" aria-label="Categories">
    <button class="chip" data-players="1" aria-pressed="false">
      <svg viewBox="0 0 32 24" aria-hidden="true"><circle cx="16" cy="8" r="5"/><path d="M6 23c0-5 4.5-8 10-8s10 3 10 8z"/></svg>
      <span>1 Player</span>
    </button>
    <button class="chip" data-players="2" aria-pressed="false">
      <svg viewBox="0 0 32 24" aria-hidden="true"><circle cx="10" cy="8" r="4.2"/><path d="M2 22c0-4.2 3.6-7 8-7s8 2.8 8 7z"/><circle cx="22" cy="8" r="4.2"/><path d="M14 22c0-4.2 3.6-7 8-7s8 2.8 8 7z"/></svg>
      <span>2 Player</span>
    </button>
    <button class="chip" data-players="4" aria-pressed="false">
      <svg viewBox="0 0 32 24" aria-hidden="true"><circle cx="4" cy="8" r="3"/><path d="M0 22c0-3.6 1.8-6.2 4-6.2s4 2.6 4 6.2z"/><circle cx="12" cy="8" r="3"/><path d="M8 22c0-3.6 1.8-6.2 4-6.2s4 2.6 4 6.2z"/><circle cx="20" cy="8" r="3"/><path d="M16 22c0-3.6 1.8-6.2 4-6.2s4 2.6 4 6.2z"/><circle cx="28" cy="8" r="3"/><path d="M24 22c0-3.6 1.8-6.2 4-6.2s4 2.6 4 6.2z"/></svg>
      <span>4 Player</span>
    </button>
  </nav>

  <div id="backdrop"></div>
  <aside id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Menu</h2>
      <button id="drawerClose" aria-label="Close menu">✕</button>
    </div>

    <section class="theme">
      <button id="themeBtn" class="theme-btn" type="button" aria-expanded="false" aria-controls="themeOpts">
        <span id="themeIc" class="theme-ic"></span>
        <span class="theme-label"><b>Theme</b><small id="themeCur">System</small></span>
        <span class="chev" data-ic="chevron"></span>
      </button>
      <div id="themeOpts" class="theme-opts" role="radiogroup" aria-label="Theme" hidden>
        <button type="button" role="radio" class="theme-opt" data-mode="system"><span data-ic="monitor"></span><span class="t">System default</span><span data-ic="check" class="tick"></span></button>
        <button type="button" role="radio" class="theme-opt" data-mode="dark"><span data-ic="moon"></span><span class="t">Dark mode</span><span data-ic="check" class="tick"></span></button>
        <button type="button" role="radio" class="theme-opt" data-mode="light"><span data-ic="sun"></span><span class="t">Light mode</span><span data-ic="check" class="tick"></span></button>
      </div>
    </section>

    <section class="settings">
      <button id="setBtn" class="theme-btn" type="button" aria-expanded="false" aria-controls="setPanel">
        <span class="theme-ic" data-ic="gear"></span>
        <span class="theme-label"><b>Settings</b><small>Close button · Vibration · Reset</small></span>
        <span class="chev" data-ic="chevron"></span>
      </button>
      <div id="setPanel" class="set-panel" hidden>
        <div class="set-row">
          <div class="set-top"><span>Close button hold time</span><b id="holdVal">1.0s</b></div>
          <input id="holdRange" type="range" min="500" max="3000" step="100" value="1000" aria-label="Hold time">
        </div>
        <div class="set-row set-flex">
          <span>Vibration</span>
          <button id="vibeSwitch" class="switch" type="button" role="switch" aria-checked="true" aria-label="Vibration"><i></i></button>
        </div>
        <button id="resetX" class="set-btn" type="button"><span data-ic="undo"></span>Reset close button position</button>
        <button id="clearRecent" class="set-btn" type="button"><span data-ic="clock"></span>Clear recently played</button>
        <button id="resetStats" class="set-btn danger" type="button"><span data-ic="trash"></span>Reset stats &amp; badges</button>
      </div>
    </section>

    <section class="stats">
      <h3 data-ic="chart">Your Stats</h3>
      <div id="statsBox" class="stats-grid"></div>
      <div id="mostPlayed" class="most-played"></div>
    </section>

    <section class="badges">
      <h3 data-ic="trophy">Badges <span id="badgeCount" class="badge-count"></span></h3>
      <div id="badgeGrid" class="badge-grid"></div>
    </section>

    <section class="saved">
      <h3>Saved Games <span class="saved-heart" data-ic="heart"></span></h3>
      <div id="savedList"></div>
    </section>
  </aside>

  <section id="player" hidden>
    <iframe id="frame" title="game"
      allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope; clipboard-write"
      allowfullscreen></iframe>

    <button id="closeBtn" aria-label="Hold 2 seconds to close">
      <svg viewBox="0 0 56 56" width="56" height="56">
        <circle class="track" cx="28" cy="28" r="24" />
        <circle id="ring" class="ring" cx="28" cy="28" r="24" pathLength="100"
                transform="rotate(-90 28 28)" />
        <path class="x" d="M20 20 L36 36 M36 20 L20 36" />
      </svg>
    </button>
  </section>

  <script src="app.js"></script>
</body>
</html>
