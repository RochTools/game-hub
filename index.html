<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Games Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <title>Games Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="home">
    <h1>Games Hub</h1>
    <div id="grid" class="grid"></div>
  </main>

  <section id="player" hidden>
    <iframe id="frame" title="game"
      allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope; clipboard-write"
      allowfullscreen></iframe>

    <button id="closeBtn" aria-label="Hold 2 seconds to close">
      <svg viewBox="0 0 56 56" width="56" height="56">
        <circle class="track" cx="28" cy="28" r="24" />
        <circle id="ring" class="ring" cx="28" cy="28" r="24" pathLength="100"
                transform="rotate(-90 28 28)" />
        <path class="x" d="M20 20 L36 36 M36 20 L20 36" />
      </svg>
    </button>
  </section>

  <script src="app.js"></script>
</body>
</html>
